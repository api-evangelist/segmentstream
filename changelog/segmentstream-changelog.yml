detail: >-
  SegmentStream has no developer changelog. Product changes are announced as
  dated posts in the "Product Updates" category of the marketing blog, written
  for marketers rather than integrators — they carry no version number, no
  breaking-change flag, and no per-endpoint or per-tool diff. docs.segmentstream.com/changelog
  and segmentstream.com/changelog both return 404.
