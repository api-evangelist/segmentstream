server:
  name: segmentstream
  description: Hosted remote MCP server that gives AI tools secure, read-only access to a SegmentStream
    workspace via the Model Context Protocol. Exposes marketing measurement, attribution, budget optimization,
    and BigQuery query capabilities as agent-callable tools.
  transport: http
  transports:
  - http
  - sse
  url: https://mcp.segmentstream.com/mcp
  auth:
    type: oauth2
    flow: authorization_code
    pkce: S256
    dynamic_client_registration: true
    authorization_endpoint: https://mcp.segmentstream.com/oauth/authorize
    token_endpoint: https://mcp.segmentstream.com/oauth/token
    registration_endpoint: https://mcp.segmentstream.com/oauth/register
    discovery:
      authorization_server: https://mcp.segmentstream.com/.well-known/oauth-authorization-server
      protected_resource: https://mcp.segmentstream.com/.well-known/oauth-protected-resource
    notes: OAuth is handled automatically in-client (browser sign-in + Allow); enforces the same permissions
      as the SegmentStream UI. Access is read-only for reporting, with configuration/creation tools scoped
      to the user's role.
  clients:
  - Claude Desktop
  - Claude Code
  - Cursor
  - VS Code
  - Windsurf
  - any MCP client
  docs:
    overview: https://docs.segmentstream.com/mcp/overview
    getting_started: https://docs.segmentstream.com/mcp/getting-started
    supported_tools: https://docs.segmentstream.com/mcp/supported-tools
  config_example:
    mcpServers:
      segmentstream:
        type: http
        url: https://mcp.segmentstream.com/mcp
