note: >-
  SegmentStream publishes no rate limits. The full documentation set was walked
  from https://docs.segmentstream.com/llms.txt (86 pages) and the MCP tool
  reference at /mcp/supported-tools was read in full: there is no statement of a
  request ceiling, a quota, a burst allowance, a throttling policy, a retry
  policy, or any RateLimit-*/X-RateLimit-*/Retry-After response header, and no
  documented status code on exhaustion. /rate-limits on the docs host returns
  404. This is an honest zero, not an unchecked field — an agent driving the MCP
  server has no published runtime signal telling it when to back off.
