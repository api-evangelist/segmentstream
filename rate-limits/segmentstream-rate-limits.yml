related_constraints:
  - surface: bigquery_execute_sql
    detail: >-
      Queries run read-only against the project's BigQuery dataset, so the
      effective ceiling is the customer's own Google BigQuery quota and slot
      allocation rather than a SegmentStream-imposed limit. SegmentStream does
      not document how it maps its callers onto those quotas.
  - surface: attribution model creation
    detail: >-
      Creating or updating an attribution model triggers an automatic one-year
      backfill that the docs say typically takes 15-30 minutes; reports return
      no data until it completes. This is a latency constraint an agent must
      tolerate, not a rate limit.
    source: https://docs.segmentstream.com/.well-known/agent-skills/segmentstream/skill.md
