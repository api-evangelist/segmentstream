summary: >-
  SegmentStream ships no maintained language SDK. Every first-party package that
  reached a registry or a public repository has been archived, and the one npm
  package that still resolves last shipped in 2019 — six and a half years before
  the MCP server it would have to wrap. The live client surface is a
  CDN-distributed browser tracker with no version pin, and the two packages the
  provider currently markets (the CLI and the Cloud TypeScript SDK) are not
  published anywhere. The programmatic surface an integrator actually uses is
  the hosted MCP server (mcp/segmentstream-mcp.yml).
